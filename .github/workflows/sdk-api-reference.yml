name: SDK API Reference

# Publishes the API reference to GitHub Pages: one page, built with pdoc from the
# package's docstrings at a released tag.
#
# Runs when a release becomes a full release ("released"), never for a
# pre-release, so the page documents the version buyers are told to install.
# Run it by hand with a tag to rebuild a release's page.
#
# A release event runs on its tag, not on main, so the repository's
# github-pages environment must allow deployments from v* tags.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to document, e.g. v1.0.3'
        required: true

permissions:
  contents: read

# One deployment at a time; a newer release waits rather than cancelling one
# that is half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # The page templates come from the commit this workflow runs on, not from
      # the tag: the package is the release's, the page around it is current, so
      # a hand-run rebuild of an older release gets today's templates.
      - uses: actions/checkout@v4
        with:
          path: workflow-ref
          sparse-checkout: api-reference

      - name: Use the current page templates
        run: |
          rm -rf api-reference
          mv workflow-ref/api-reference api-reference
          rm -rf workflow-ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the package and pdoc
        run: |
          python -m pip install --upgrade pip
          pip install . pdoc==15.0.1

      # The package alone, without its submodules: everything a buyer uses is
      # exported from it. -W error fails the build on any warning. The templates
      # in api-reference/ give the pages a title and description search engines
      # can show.
      - name: Build the reference
        run: python -W error -m pdoc --docformat google -t api-reference -o site lifespan_predictor_sdk '!lifespan_predictor_sdk.'

      # A sitemap to submit in Google Search Console and, when the repository
      # variable GOOGLE_SITE_VERIFICATION holds Search Console's token (such as
      # google0123abcd), the file that proves the site is ours. The token
      # reaches the shell only as an environment variable, and anything but
      # that form fails the build rather than becoming a file name.
      - name: Add the sitemap and the Search Console file
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          cat > site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://kooditurva.github.io/lifespan-predictor-sdk/lifespan_predictor_sdk.html</loc></url>
          </urlset>
          EOF
          if [ -n "$GOOGLE_SITE_VERIFICATION" ]; then
            if [[ ! "$GOOGLE_SITE_VERIFICATION" =~ ^google[0-9a-f]+$ ]]; then
              echo "GOOGLE_SITE_VERIFICATION must look like google0123abcd" >&2
              exit 1
            fi
            # printf, not echo: the same bytes as the file Search Console hands out.
            printf 'google-site-verification: %s.html' "$GOOGLE_SITE_VERIFICATION" > "site/$GOOGLE_SITE_VERIFICATION.html"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
