name: SDK Cloud Tests

# The release. Run by hand on main: the local tests, the cloud tests and the
# example notebooks against the free tier, then, when all pass, tag vX.Y.Z and
# create a draft release with the tested wheel. A maintainer publishes it in
# GitHub; publishing is permanent, because releases here are immutable. On any
# other branch it tests and drafts nothing.
#
# Four jobs. build builds the wheel and runs the local tests against it, and
# keeps it as this run's artifact; nothing is billed before it passes.
# cloud-tests and one notebook job per example then run in parallel, each
# installing that same wheel and signing in for itself; each notebook job keeps
# its recording. publish fetches the wheel and every recording. "Re-run failed
# jobs" reruns only what failed: a failed notebook alone, or the publish alone.
#
# Runs in any fork, in the fork's own AWS account, with no edit to this file.
# Everything account-specific comes from the fork's settings:
#
#   algorithm_arn input, or the SAGEMAKER_ALGORITHM_ARN repository variable:
#       the algorithm ARN of your Marketplace subscription. Defaults to the
#       free tier's in eu-west-1. The region is read from it.
#   AWS_ROLE_ARN secret:        a role this repository may assume through
#                               GitHub OIDC. Each job that signs in does so
#                               for three hours, so the role's
#                               MaxSessionDuration must be at least 10800
#                               seconds.
#   AWS_SESSION_SECONDS variable: optional; the session's length in seconds,
#                               10800 if unset. Set it lower if your role
#                               allows less, though a notebook may then not
#                               finish inside it.
#   SAGEMAKER_ROLE_ARN secret:  the SageMaker execution role your jobs run as.
#   SAGEMAKER_BUCKET variable:  optional; SageMaker's default bucket otherwise.

on:
  workflow_dispatch:
    inputs:
      algorithm_arn:
        description: 'Algorithm ARN of your subscription (empty: the SAGEMAKER_ALGORITHM_ARN variable, else the free tier in eu-west-1)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      algorithm_arn: ${{ steps.resolve_arn.outputs.arn }}
      region: ${{ steps.resolve_arn.outputs.region }}
      notebooks: ${{ steps.resolve_arn.outputs.notebooks }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Before anything is billed: a published version never moves. Only where
      # the run drafts; elsewhere it tests and records, and that's allowed.
      - name: Stop if this version is already published
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/draft_release.py check

      # Resolving needs no credentials, so a malformed ARN stops the run before
      # anything signs in. The dispatch input reaches the script through its
      # environment, never interpolated into it, so it cannot inject a command.
      # It also outputs the example notebooks, which the notebook matrix reads.
      - name: Resolve the algorithm ARN and its region
        id: resolve_arn
        env:
          SAGEMAKER_ALGORITHM_ARN: ${{ inputs.algorithm_arn || vars.SAGEMAKER_ALGORITHM_ARN }}
        run: python scripts/run_cloud_tests.py resolve

      # scripts/run_cloud_tests.py is what anyone with a clone runs: one way to
      # run these tests, not two. Each job runs its own part of it.
      - name: Build the wheel and run the local tests against it
        run: python scripts/run_cloud_tests.py build

      - name: Keep the tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: tested-wheel
          path: dist/*.whl
          if-no-files-found: error

  cloud-tests:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # For OIDC authentication
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the tested wheel
        uses: actions/download-artifact@v4
        with:
          name: tested-wheel
          path: dist

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.build.outputs.region }}
          role-duration-seconds: ${{ vars.AWS_SESSION_SECONDS || '10800' }}

      - name: Run the cloud tests against the tested wheel
        env:
          SAGEMAKER_ALGORITHM_ARN: ${{ needs.build.outputs.algorithm_arn }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          SAGEMAKER_BUCKET: ${{ vars.SAGEMAKER_BUCKET }}
        run: python scripts/run_cloud_tests.py cloud

  notebook:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # For OIDC authentication
      contents: read
    strategy:
      # Each notebook is its own record: one failing doesn't cancel the others,
      # and "Re-run failed jobs" reruns only it.
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.build.outputs.notebooks) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the tested wheel
        uses: actions/download-artifact@v4
        with:
          name: tested-wheel
          path: dist

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.build.outputs.region }}
          role-duration-seconds: ${{ vars.AWS_SESSION_SECONDS || '10800' }}

      # Runs the notebook with the tested wheel and writes its cleaned outputs
      # in place.
      - name: Record the notebook with the tested wheel
        env:
          NOTEBOOK: ${{ matrix.notebook }}
          SAGEMAKER_ALGORITHM_ARN: ${{ needs.build.outputs.algorithm_arn }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          SAGEMAKER_BUCKET: ${{ vars.SAGEMAKER_BUCKET }}
        run: python scripts/run_cloud_tests.py record "examples/$NOTEBOOK"

      - name: Keep the recorded notebook
        uses: actions/upload-artifact@v4
        with:
          name: recording-${{ matrix.notebook }}
          path: examples/${{ matrix.notebook }}
          if-no-files-found: error

  publish:
    needs: [build, cloud-tests, notebook]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # For the tag and the draft release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the tested wheel
        uses: actions/download-artifact@v4
        with:
          name: tested-wheel
          path: dist

      # Into examples/, over main's unexecuted copies.
      - name: Fetch the recorded notebooks
        uses: actions/download-artifact@v4
        with:
          pattern: recording-*
          path: examples
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALGORITHM_ARN: ${{ needs.build.outputs.algorithm_arn }}
        run: >-
          python scripts/draft_release.py draft
          --algorithm-arn "$ALGORITHM_ARN" --tested-commit "$GITHUB_SHA"
